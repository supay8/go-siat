name: Release Please

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versión a publicar, por ejemplo 1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate official module release line
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^1\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "github.com/supay8/go-siat uses the v1.x release line"
            exit 1
          }
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: go
          release-as: ${{ inputs.release_version }}
